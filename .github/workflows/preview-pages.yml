name: Hairmagic September Preview

on:
  push:
    branches:
      - recovery/astra-september-2026
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hairmagic-september-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        run: npm run check

      - name: Add no-Jekyll marker
        run: touch dist/.nojekyll

      - name: Publish preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false
          commit_message: "deploy: September 2026 preview @ ${{ github.sha }}"
